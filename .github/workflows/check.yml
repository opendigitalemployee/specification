name: Check specification draft
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
      - run: python -m pip install 'jsonschema>=4.25,<5'
      - name: Check JSON, package graphs, schemas and release hashes
        run: |
          python - <<'PYTHON'
          import hashlib, json, sys
          from pathlib import Path
          sys.path.insert(0, '.github/checks')
          from package_contract import check
          for p in Path('.').rglob('*.json'):
              if '.git' not in p.parts:
                  json.loads(p.read_text())
          for p in Path('examples').glob('*/manifest.json'):
              check(p.parent, Path('.'))
          release = json.loads(Path('release-manifest.json').read_text())
          for name, item in release['files'].items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest() == item['sha256'], name
          print('PASS: package schemas, references, affiliation, inventory and hashes; no runtime tests claimed')
          PYTHON
      - name: Check all affiliation and self-description regressions
        run: |
          python -B .github/checks/self_description.py --standard-root . --index examples/personal-description/0.2.0/index.json
          python -B .github/checks/self_description.py --standard-root . --index spec/research/proposals/personal-description-template/0.1.0/index.json --allow-draft
          python -B -m unittest discover -s .github/checks -p 'test_*.py' -v
