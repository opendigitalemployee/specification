name: Proposal
description: Propose a change to the specification, terminology or an integration.
title: '[Proposal] '
labels: ['proposal', 'needs-triage']
body:
  - type: markdown
    attributes:
      value: |
        Use English. One independently decidable change per issue.
        A concrete problem is enough to start; a complete solution is not required.
  - type: input
    id: target
    attributes:
      label: Draft and affected section
      placeholder: 'main at commit …; spec/SPECIFICATION.md section …; glossary ID …'
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem or need
      description: Who needs this, and what is difficult with the current draft? Give an example.
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: Proposed change
      description: Suggested wording, object relationship or design; alternatives are welcome.
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility
      description: Effect on saved packages, integrations, versions and migration; say unknown if unresolved.
  - type: textarea
    id: verification
    attributes:
      label: Evidence and verification
      description: Sources, implementation experience or a test that would show an improvement.
  - type: input
    id: contributor
    attributes:
      label: Contributor
      description: Person or submitting account; include agent name if applicable.
